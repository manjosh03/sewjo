<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Fabric</title>
    <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" rel="stylesheet">
    <style>
        /* Custom styles can go here */
        body {
            background-image: url("pic.jpg");
            background-size: cover;
        }

        .container-fluid {
            margin-top: 40px;
        }

        .form-container {
            background-color: rgba(255, 255, 255, 0.85);
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }

        h1 {
            font-size: 2.5rem;
            font-weight: 700;
            color: #007bff;
        }

        .btn-primary {
            background-color: #007bff;
            border-color: #007bff;
        }

        .btn-primary:hover {
            background-color: #0056b3;
            border-color: #0056b3;
        }

        .form-wrapper {
            margin-top: 30px;
        }
    </style>
</head>

<body>
    <div class="container-fluid">
        <div class="row justify-content-center">
            <div class="col-md-6 col-lg-4 form-wrapper">
                <div class="form-container">
                    <h1 class="text-center mt-3 mb-4">New Pattern</h1>
                    <form action="/pattern/add" method="post">
                        <div class="form-group">
                            <label for="name">Name</label>
                            <input type="text" id="name" name="name" class="form-control" placeholder="Enter Name"
                                required>
                        </div>
                        <div class="form-group">
                            <label for="description">Description</label>
                            <input type="text" id="description" name="description" class="form-control" placeholder="Enter Description"
                                required>
                        </div>
                        <div class="form-group">
                            <label for="price">Price</label>
                            <div class="input-group">
                                <div class="input-group-prepend">
                                    <span class="input-group-text">$</span>
                                </div>
                                <input type="number" id="price" name="price" class="form-control"
                                    placeholder="Enter Price" required>
                            </div>
                        </div>
                        <div class="form-group">
                            <label for="type">Type</label>
                            <select id="type" name="type" class="form-control" required>
                                <option value="">Select Type</option>
                                <th:block th:each="type : ${patternTypes}">
                                    <option th:value="${type}" th:text="${type}"></option>
                                </th:block>
                            </select>
                        </div>
                        <div class="d-grid gap-2 mt-3">
                            <input class="btn btn-primary btn-lg" type="submit" value="Save">
                        </div>
                        <div class="d-grid gap-2 mt-3">
                            <a class="btn btn-outline-primary btn-lg" href="/pattern/view" role="button">View
                                Patterns</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
</body>

</html>
