<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Pattern</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" type="text/css" th:href="@{/css/homepage.css}" />
    <style>
        body {
            background-image: url('images/sewjobackground.png');
            background-size: cover;
            background-attachment: fixed;
        }

        .form-container {
            background-color: rgba(0, 0, 0, 0.5);
            color: #fff;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.5);
            margin-top: 100px;
        }

        h1 {
            font-size: 2.5rem;
            font-weight: 700;
            color: #efefef;
        }

        .btn-primary {
            background-color: #5c6bc0;
            border-color: #5c6bc0;
        }

        .btn-primary:hover {
            background-color: #3949ab;
            border-color: #3949ab;
        }

        .btn-outline-primary {
            color: #fff;
            border-color: #fff;
        }

        .btn-outline-primary:hover {
            color: #000;
            background-color: #fff;
            border-color: #fff;
        }

        .form-group {
            margin-top: 15px;
        }
    </style>
</head>

<body>
    <nav class="navbar navbar-expand-lg bg-dark navbar-dark fixed-top">
        <div class="container">
            <a class="navbar-brand" href="#">
                sewjo
            </a>

            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navmenu"
                aria-controls="navmenu" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse ms-auto" id="navmenu">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a href="/homepage/view" class="nav-link">Home</a>
                    </li>
                    <li class="nav-item">
                        <a href="/fabric/view" class="nav-link">Fabrics</a>
                    </li>
                    <li class="nav-item">
                        <a href="/pattern/view" class="nav-link active">Patterns</a>
                    </li>
                    <li class="nav-item">
                        <a href="/project/view" class="nav-link">Projects</a>
                    </li>
                    <li class="nav-item">
                        <a href="/community/view" class="nav-link">Community</a>
                    </li>
                    <li class="nav-item"><a href="/myProfile/profile" class="nav-link">My Profile</a></li>
                    <li class="nav-item">
                        <a href="/logout" class="nav-link text-light">Logout</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>
    <div class="container-fluid">
        <div class="row justify-content-center">
            <div class="col-md-6 col-lg-4 form-wrapper">
                <div class="form-container">
                    <h1 class="text-center mt-3 mb-4">New Pattern</h1>
                    <form action="/pattern/add" method="post" enctype="multipart/form-data">
                        <div class="form-group">
                            <label for="name">Name</label>
                            <input type="text" id="name" name="name" class="form-control" placeholder="Enter Name"
                                required>
                        </div>
                        <div class="form-group">
                            <label for="description">Description</label>
                            <input type="text" id="description" name="description" class="form-control"
                                placeholder="Enter Description" required>
                        </div>
                        <div class="form-group">
                            <label for="price">Price</label>
                            <div class="input-group">
                                <div class="input-group-prepend">
                                    <span class="input-group-text">$</span>
                                </div>
                                <input type="number" id="price" name="price" class="form-control"
                                    placeholder="Enter Price" required>
                            </div>
                        </div>
                        <div class="form-group">
                            <label for="type">Type</label>
                            <select id="type" name="type" class="form-control" required>
                                <option value="">Select Type</option>
                                <th:block th:each="type : ${patternTypes}">
                                    <option th:value="${type}" th:text="${type}"></option>
                                </th:block>
                            </select>
                        </div>

                        <div class="form-group">
                            <label for="type">Image</label>
                            <input type="file" name="file" class="form-control" accept=".jpeg,.jpg,.png" required>
                        </div>

                        <div class="d-grid gap-2 mt-3">
                            <input class="btn btn-primary btn-lg" type="submit" value="Save">
                        </div>
                        <div class="d-grid gap-2 mt-3">
                            <a class="btn btn-outline-primary btn-lg" href="/pattern/view" role="button">View
                                Patterns</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
</body>

</html>
