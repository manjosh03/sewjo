<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Project</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" type="text/css" th:href="@{/css/homepage.css}" />
    <style>
        body {
            background-image: url('images/sewjobackground.png');
            background-size: cover;
            background-attachment: fixed;
        }

        .form-container {
            background-color: rgba(0, 0, 0, 0.5);
            color: #fff;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.5);
            margin-top: 100px;
        }

        h1 {
            font-size: 2.5rem;
            font-weight: 700;
            color: #efefef;
        }

        .btn-primary {
            background-color: #5c6bc0;
            border-color: #5c6bc0;
        }

        .btn-primary:hover {
            background-color: #3949ab;
            border-color: #3949ab;
        }

        .btn-outline-primary {
            color: #fff;
            border-color: #fff;
        }

        .btn-outline-primary:hover {
            color: #000;
            background-color: #fff;
            border-color: #fff;
        }

        .form-group {
            margin-top: 15px;
        }
    </style>
</head>

<body>
<nav class="navbar navbar-expand-lg bg-dark navbar-dark fixed-top">
    <div class="container">
        <a class="navbar-brand" href="#">
            sewjo
        </a>

        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navmenu"
                aria-controls="navmenu" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse ms-auto" id="navmenu">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item">
                    <a href="/homepage/view" class="nav-link">Home</a>
                </li>
                <li class="nav-item">
                    <a href="/fabric/view" class="nav-link">Fabrics</a>
                </li>
                <li class="nav-item">
                    <a href="/pattern/view" class="nav-link">Patterns</a>
                </li>
                <li class="nav-item">
                    <a href="/project/view" class="nav-link active">Projects</a>
                </li>
                <li class="nav-item">
                    <a href="/community/view" class="nav-link">Community</a>
                </li>
                <li class="nav-item"><a href="/myProfile/profile" class="nav-link">My Profile</a></li>
                <li class="nav-item">
                    <a href="/logout" class="nav-link text-light">Logout</a>
                </li>
            </ul>
        </div>
    </div>
</nav>
<div class="container-fluid">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-4 form-wrapper">
            <div class="form-container">
                <h1 class="text-center mt-3 mb-4">Edit Project</h1>
                <form action="/project/edit" method="post">
                    <input type="hidden" name="id" th:value="${project.id}">
                    <div class="form-group">
                        <label for="name">Name</label>
                        <input type="text" id="name" name="name" class="form-control" th:value="${project.name}" placeholder="Enter Name" required>
                    </div>

                    <div class="form-group">
                        <label for="type">Type</label>
                        <select id="type" name="type" class="form-control" required>
                            <option value="">Select Type</option>
                            <th:block th:each="type : ${projectTypes}">
                                <option th:value="${type}" th:text="${type}" th:selected="${type == project.type}"></option>
                            </th:block>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="fabricId">Fabric</label>
                        <select id="fabricId" name="fabricId" class="form-control" required>
                            <option value="">Select Fabric</option>
                            <th:block th:each="fabric : ${fabrics}">
                                <option th:value="${fabric.getId()}" th:text="${fabric.getName()}" th:selected="${fabric.getId() == project.fabricId}"></option>
                            </th:block>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="patternId">Pattern</label>
                        <select id="patternId" name="patternId" class="form-control" required>
                            <option value="">Select Pattern</option>
                            <th:block th:each="pattern : ${patterns}">
                                <option th:value="${pattern.getId()}" th:text="${pattern.getName()}" th:selected="${pattern.getId() == project.patternId}"></option>
                            </th:block>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="description">Description</label>
                        <input type="text" id="description" name="description" class="form-control" th:value="${project.description}" placeholder="Enter Description" required>
                    </div>

                    <div class="form-group">
                        <label for="progress" class="form-label">Progress</label>
                        <input type="number" id="progress" name="progress" class="form-control" min="0" max="100" th:value="${project.progress}" placeholder="Enter progress">
                    </div>

                    <div class="form-group form-check form-switch">
                        <input class="form-check-input" type="checkbox" id="shared" name="shared" th:checked="${project.shared}">
                        <label class="form-check-label" for="shared">Enable Sharing</label>
                    </div>

                    <div class="d-grid gap-2 mt-3">
                        <input class="btn btn-primary btn-lg" type="submit" value="Save">
                    </div>
                    <div class="d-grid gap-2 mt-3">
                        <a class="btn btn-outline-primary btn-lg" href="/project/view" role="button">View projects</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
<script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
</body>

</html>
