<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Profile</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/slick-carousel/1.8.1/slick.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/slick-carousel/1.8.1/slick-theme.min.css">
    <link rel="stylesheet" type="text/css" th:href="@{/css/homepage.css}" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.3.0/font/bootstrap-icons.css">
    <style>
        body {
            background-color: #121212;
            color: #eaeaea;
        }

        .profile-card {
            background-color: #1f1f1f;
            color: #eaeaea;
            border-radius: 8px;
            padding: 20px;
            margin-top: 20px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.35);
        }

        .profile-card img {
            border-radius: 50%;
        }

        .profile-card h1 {
            font-size: 24px;
            font-weight: 700;
        }

        .profile-card p {
            font-size: 16px;
        }
    </style>
</head>

<body>
    <nav class="navbar navbar-expand-lg bg-dark navbar-dark fixed-top">
        <div class="container">
            <a class="navbar-brand" href="#">
                sewjo
            </a>

            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navmenu"
                aria-controls="navmenu" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse ms-auto" id="navmenu">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a href="/homepage/view" class="nav-link">Home</a>
                    </li>
                    <li class="nav-item">
                        <a href="/fabric/view" class="nav-link">Fabrics</a>
                    </li>
                    <li class="nav-item">
                        <a href="/pattern/view" class="nav-link">Patterns</a>
                    </li>
                    <li class="nav-item">
                        <a href="#" class="nav-link">My Lists</a>
                    </li>
                    <li class="nav-item">
                        <a href="#" class="nav-link">Community</a>
                    </li>
                    <li class="nav-item">
                        <a href="#" class="nav-link">Measurements</a>
                    </li>
                    <li class="nav-item">
                        <a href="#" class="nav-link active">My Profile</a>
                    </li>
                    <li class="nav-item">
                        <a href="/logout" class="nav-link text-light">Logout</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="profile-card text-center">
                    <img src="https://via.placeholder.com/100" alt="Profile Picture" class="mb-3">
                    <h1 th:text="${user.name}">User's Name</h1>
                    <p>Email: <span th:text="${user.email}">user@example.com</span></p>
                    <p>Bio: <span th:text="${user.bio}">Lorem ipsum dolor sit amet, consectetur adipiscing elit. Proin
                            ac elit id arcu consequat vehicula non nec odio.</span></p>
                    
                    <!-- Add Bio Form -->
                    <form th:action="@{/myProfile/updateBio}" method="post" class="mt-3">
                        <div class="mb-3">
                            <textarea class="form-control" name="bio" placeholder="Add or update your bio" rows="3" required></textarea>
                        </div>
                        <button type="submit" class="btn btn-primary">Update Bio</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS and dependencies -->
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js"
        integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r"
        crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.min.js"
        integrity="sha384-0pUGZvbkm6XF6gxjEnlmuGrJXVbNuzT9qBBavbLwCsOGabYfZo0T0to5eqruptLy"
        crossorigin="anonymous"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
</body>

</html>
