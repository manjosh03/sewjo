<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Fabric</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-GLhlTQ8iRABdZLl6O3oVMWSktQOp6b7In1Zl3/Jr59b6EGGoI1aFkw7cmDA6j6gD" crossorigin="anonymous">
    <style>
        .background {
            position: fixed;
            top: 0;
            left: 0;
            height: 100%;
            width: 100%;
            background-image: url("pic.jpg");
            background-size: cover;
            background-position: center;
            filter: blur(10px);
            z-index: -1;
        }

        .container-fluid {
            position: relative;
            padding-top: 50px;
        }

        .form-container {
            background-color: rgba(255, 255, 255, 0.85);
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }

        h1 {
            font-size: 2.5rem;
            font-weight: 700;
            color: #007bff;
        }

        .btn-primary {
            background-color: #007bff;
            border-color: #007bff;
        }

        .btn-primary:hover {
            background-color: #0056b3;
            border-color: #0056b3;
        }

        .form-wrapper {
            position: relative;
            z-index: 1;
        }
    </style>
</head>

<body class="background">
<div></div>
<div class="container-fluid">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-4 form-wrapper">
            <div class="form-container">
                <h1 class="text-center mt-3 mb-4">New Fabric</h1>
                <form action="/fabric/add" method="post">
                    <div class="mb-3">
                        <input type="text" id="name" name="name" class="form-control form-control-lg"
                               placeholder="Name" required>
                    </div>
                    <div class="mb-3">
                        <input type="text" id="color" name="color" class="form-control form-control-lg"
                               placeholder="Color" required>
                    </div>
                    <div class="mb-3">
                        <input type="number" id="width" name="width" class="form-control form-control-lg"
                               placeholder="Width" required>
                    </div>
                    <div class="mb-3">
                        <input type="number" id="height" name="height" class="form-control form-control-lg"
                               placeholder="Height" required>
                    </div>
                    <div class="mb-3">
                        <input type="number" id="price" name="price" class="form-control form-control-lg"
                               placeholder="Price" required>
                    </div>
                    <div class="mb-3">
                        <input type="text" id="type" name="type" class="form-control form-control-lg"
                               placeholder="Type" required>
                    </div>
                    <div class="d-grid gap-2">
                        <input class="btn btn-primary btn-lg" type="submit" value="SEND">
                    </div>
                    <div class="d-grid gap-2 mt-3">
                        <a class="btn btn-outline-primary btn-lg" href="/fabric/view" role="button">VIEW ALL FABRIC</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
</body>

</html>
