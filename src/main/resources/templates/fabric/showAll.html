<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fabric Stash</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/slick-carousel/1.8.1/slick.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/slick-carousel/1.8.1/slick-theme.min.css">
    <link rel="stylesheet" type="text/css" th:href="@{/css/homepage.css}" />
    <style>
        .card-img-top {
            width: 150px;
            height: 150px;
            object-fit: cover;
            display: block;
            margin: auto;
            margin-top: 30px;
        }

        .custom-btn {
            color: white;
            border-color: white;
        }

        .custom-btn:hover {
            color: #000;
            background-color: white;
            border-color: white;
        }

        .form-container {
            max-width: 300px;
            margin-right: 20px;
        }

        .form-control {
            color: #000;
        }
    </style>
</head>

<body>
    <nav class="navbar navbar-expand-lg bg-dark navbar-dark fixed-top">
        <div class="container">
            <a class="navbar-brand " href="#">
                sewjo
            </a>

            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navmenu"
                aria-controls="navmenu" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse ms-auto" id="navmenu">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a href="/homepage/view" class="nav-link">Home</a>
                    </li>
                    <li class="nav-item">
                        <a href="#" class="nav-link active">Fabrics</a>
                    </li>
                    <li class="nav-item">
                        <a href="/pattern/view" class="nav-link">Patterns</a>
                    </li>
                    <li class="nav-item">
                        <a href="/project/view" class="nav-link">Projects</a>
                    </li>
                    <li class="nav-item">
                        <a href="#" class="nav-link">Community</a>
                    </li>
                    <li class="nav-item">
                        <a href="#" class="nav-link">Measurements</a>
                    </li>
                    <li class="nav-item">
                        <a href="#" class="nav-link">Stats</a>
                    </li>
                    <li class="nav-item">
                        <a href="/logout" class="nav-link text-light">Logout</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <main class="container" style="margin-top: 40px;">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <h1 class="mb-0">All Fabrics</h1>
            <a th:href="@{/fabric/add-page}" class="btn btn-outline-primary custom-btn">Add New Fabric</a>
        </div>

        <div class="d-flex">
            <div class="form-container">
                <form id="sortForm">
                    <div class="mb-3">
                        <label for="fabricName" class="form-label">Fabric Name:</label>
                        <input type="text" id="fabricName" class="form-control" placeholder="Enter name">
                    </div>
                    <div class="mb-3">
                        <label for="sortBy" class="form-label">Sort by:</label>
                        <select class="form-control" id="sortBy" onchange="handleSortChange()">
                            <option value="name">Name</option>
                            <option value="color">Color</option>
                            <option value="width">Width</option>
                            <option value="height">Height</option>
                            <option value="price">Price</option>
                            <option value="type">Type</option>
                        </select>
                    </div>
                    <div class="mb-3">
                        <label for="sortOrder" class="form-label">Sort order:</label>
                        <select class="form-control" id="sortOrder" onchange="handleOrderChange()">
                            <option value="asc">Ascending</option>
                            <option value="desc">Descending</option>
                        </select>
                    </div>
                    <div class="mb-3">
                        <label for="filterByType" class="form-label">Filter by Type:</label>
                        <select class="form-control" id="filterByType" onchange="handleTypeFilter()">
                            <option value="">All Types</option>
                            <option value="Cotton">Cotton</option>
                            <option value="Silk">Silk</option>
                            <option value="Polyester">Polyester</option>
                            <option value="Wool">Wool</option>
                        </select>
                    </div>
                    <button type="button" class="btn btn-primary" onclick="renderFabrics()">Sort</button>
                </form>
            </div>

            <div class="row flex-grow-1" id="fabricList">
                <!-- Thymeleaf iteration to render fabric cards -->
                <div th:each="fabric:${fabrics}" class="col-lg-4 col-md-6 mb-4">
                    <div class="card bg-dark text-light">
                        <img th:src="${fabric.getImage()}" class="card-img-top" alt="Fabric picture">
                        <div class="card-body text-center">
                            <h5 class="card-title" th:text="${fabric.name}">Fabric Name</h5>
                            <p class="card-text">
                                Colour: <span th:text="${fabric.getColour()}">Fabric Colour</span><br>
                                Width: <span th:text="${fabric.getWidth()}">Fabric Width</span><br>
                                Height: <span th:text="${fabric.getHeight()}">Fabric Height</span><br>
                                Price: <span th:text="${fabric.getPrice()}">Fabric Price</span><br>
                                Type: <span th:text="${fabric.getType()}">Fabric Type</span>
                            </p>
                            <div class="row">
                                <div class="col text-left">
                                    <form th:action="@{/fabric/edit-page}" method="get">
                                        <input type="hidden" name="id" th:value="${fabric.getId()}" />
                                        <button type="submit" class="btn btn-sm btn-secondary">Edit</button>
                                    </form>
                                </div>
                                <div class="col text-right">
                                    <form th:action="@{/fabric/delete}" method="post">
                                        <input type="hidden" name="id" th:value="${fabric.id}" />
                                        <button type="submit" class="btn btn-sm btn-danger"
                                            onclick="return confirm('Are you sure you want to delete this fabric?')">Delete</button>
                                    </form>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js"
        integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r"
        crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.min.js"
        integrity="sha384-0pUGZvbkm6XF6gxjEnlmuGrJXVbNuzT9qBBavbLwCsOGabYfZo0T0to5eqruptLy"
        crossorigin="anonymous"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/slick-carousel/1.8.1/slick.min.js"></script>

    <script>
        function renderFabrics() {
            // Fetch selected values from UI
            var sortBy = document.getElementById('sortBy').value;
            var sortOrder = document.getElementById('sortOrder').value;
            var filterType = document.getElementById('filterByType').value;
            var fabricName = document.getElementById('fabricName').value;

            // Construct URL with query parameters
            var url = '/fabric/view?sort=' + sortBy + '&order=' + sortOrder;
            if (filterType) {
                url += '&type=' + filterType;
            }
            if (fabricName) {
                url += '&name=' + fabricName;
            }

            // Fetch fabrics from backend using fetch API
            fetch(url)
                .then(response => response.json())
                .then(fabrics => {
                    // Render fabrics on UI (update DOM elements)
                    var fabricList = document.getElementById('fabricList');
                    fabricList.innerHTML = ''; // Clear existing fabrics

                    fabrics.forEach(fabric => {
                        var cardHtml = `
                        <div class="col-lg-4 col-md-6 mb-4">
                            <div class="card bg-dark text-light">
                                <img src="http://via.placeholder.com/150" class="card-img-top" alt="Fabric picture">
                                <div class="card-body text-center">
                                    <h5 class="card-title">${fabric.name}</h5>
                                    <p class="card-text">
                                        Color: ${fabric.color}<br>
                                        Width: ${fabric.width}<br>
                                        Height: ${fabric.height}<br>
                                        Price: ${fabric.price}<br>
                                        Type: ${fabric.type}
                                    </p>
                                    <div class="row">
                                        <div class="col text-left">
                                            <button type="button" class="btn btn-sm btn-secondary">Edit</button>
                                        </div>
                                        <div class="col text-right">
                                            <form th:action="@{/fabric/delete}" method="post">
                                                <input type="hidden" name="id" th:value="${fabric.id}" />
                                                <button type="submit" class="btn btn-sm btn-danger">Delete</button>
                                            </form>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    `;
                        fabricList.innerHTML += cardHtml; // Append card to fabricList
                    });
                })
                .catch(error => console.error('Error fetching fabrics:', error));
        }

        function handleSortChange(event) {
            renderFabrics();
        }

        function handleOrderChange(event) {
            renderFabrics();
        }

        function handleTypeFilter(event) {
            renderFabrics();
        }

        function handleDelete(id) {
            fetch(`/fabric/delete/${id}`, {
                method: 'DELETE',
            })
                .then(response => {
                    if (!response.ok) {
                        throw new Error('Network response was not ok');
                    }
                    console.log(`Deleted fabric with ID ${id}`);
                })
                .catch(error => console.error('Error deleting fabric:', error));
        }
    </script>
</body>

</html>
